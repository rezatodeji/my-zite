<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>زایت | سامانه حسابداری آنلاین</title>
    <meta name="description" content="زایت یک سامانه حسابداری آنلاین و تحت وب است." />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
      }
      .card {
        background: white;
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        padding: 40px;
        max-width: 640px;
        width: 100%;
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #2563eb;
        color: white;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 16px;
      }
      h1 { font-size: 24px; margin-bottom: 8px; }
      p { color: #64748b; line-height: 1.7; margin-bottom: 24px; }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #2563eb;
        color: white;
        padding: 12px 24px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 500;
      }
      .note {
        margin-top: 24px;
        font-size: 13px;
        color: #94a3b8;
      }
      code {
        background: #f1f5f9;
        padding: 2px 6px;
        border-radius: 6px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">ز</div>
      <h1>زایت | سامانه حسابداری آنلاین</h1>
      <p>
        این پروژه با Next.js ساخته شده و برای اجرا نیاز به سرور توسعه دارد.
        لطفاً دستور زیر را اجرا کنید:
      </p>
      <a class="btn" href="/out/index.html" onclick="document.getElementById('run').style.display='block'; return false;">
        ورود به سایت
      </a>
      <div id="run" class="note" style="display:none;">
        <p>اگر سایت باز نشد، دستور زیر را در ترمینال اجرا کنید:</p>
        <p style="margin-top:8px;"><code>npm run dev</code></p>
      </div>
      <p class="note">
        یا فایل خروجی استاتیک در مسیر <code>out/index.html</code> موجود است.
      </p>
    </div>
  </body>
</html>
